<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>barrel</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap');

  html, body {
    height: 100%;
    margin: 0;
    background-color: #f7f7f4;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: fit-content;
    padding: 0 1rem;
    box-sizing: border-box;
  }

  img {
    width: 360px;
    max-width: 100%;
    height: auto;
  }

  p {
    font-family: 'EB Garamond', serif;
    font-size: 1.5rem;
    margin-top: 1rem;
    white-space: nowrap;
  }

  @media (max-width: 600px) {
    .container {
      width: 100%;
    }

    img {
      width: 100%;
    }

    p {
      font-size: 6vw;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <img src="barrel.png" alt="barrel">
    <p>[work in progress]</p>
  </div>
</body>
</html>
